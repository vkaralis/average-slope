[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "average-slope-pk"
version = "0.1.0"
description = "Model-independent average slope from concentration-time data between t=0 and observed Tmax"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vangelis D. Karalis" }]
keywords = ["pharmacokinetics", "bioequivalence", "absorption-rate", "average-slope"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
average-slope = "average_slope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
